name: CI (HDL — LVS + behavioral boot)

# Path-gated: only runs when the HDL model, the C emulator, the ROM/media inputs,
# the sync guards, or the board connectivity change. Doc-only and routing-loop
# pushes (which never touch these paths) skip it entirely. The deep cosim value
# guard (sync/cosim_check.sh) is intentionally NOT here -- it runs pre-push
# instead (see .githooks/pre-push); this keeps the HDL CI to the boot regression.
#
# The behavioral guards are split across independent jobs that run in parallel.
# Wall clock is the slowest job (b2-video, ~7 min) rather than the sum (~26 min).
# The set of guards executed is unchanged; only their scheduling is.
#
# Jukuravi paths are listed individually rather than as spinoffs/jukuravi/**:
# that glob also covered sessions/ (captured serial-log bytes) and the prose docs,
# so committing run evidence used to trigger the whole HDL suite for nothing.

on:
  workflow_dispatch:
  push:
    paths:
      - 'hdl/**'
      - 'cosim/**'
      - 'tests/**'
      - 'spinoffs/jukuravi/firmware/**'
      - 'spinoffs/jukuravi/host.py'
      - 'spinoffs/jukuravi/protocol.py'
      - 'spinoffs/jukuravi/nano/**'
      - 'roms/**'
      - 'sync/**'
      - 'media/disks/**'
      - 'media/system/**'
      - 'kicad/juku.board.json'
      - 'scripts/report_video_physical_probes.py'
      - 'docs/video-physical-probes.md'
      - 'scripts/report_video_pit_timing.py'
      - 'docs/video-pit-timing.md'
      - 'spinoffs/minimal-vga/hdl/u24_dram_timing*.v'
      - 'spinoffs/minimal-vga/hdl/vjuga_juku*.v'
      - 'spinoffs/minimal-vga/sim/u24_dram_timing_check.sh'
      - 'spinoffs/minimal-vga/sim/vjuga_boot_check.sh'
      - 'spinoffs/minimal-vga/hdl/revb/**'
      - 'spinoffs/minimal-vga/sim/revb_boot_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_card_tb_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_bus_assert_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_tier_suite.sh'
      - 'spinoffs/minimal-vga/sim/revb_bringup_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_video_check.sh'
      - 'spinoffs/minimal-vga/roms/revb-bringup/**'
      - 'ref/juku-machine-facts.json'
      - 'scripts/check_spinoff_commons.py'
      - 'scripts/check_revb_boards.py'
      - 'spinoffs/minimal-vga/kicad/revb/**'
      - 'spinoffs/minimal-vga/sync/revb_lvs.sh'
      - 'spinoffs/minimal-vga/sync/revb_mem_map.json'
      - 'spinoffs/minimal-vga/roms/ekta37_z80.bin'
      - 'spinoffs/minimal-vga/external/tv80'
      - 'spinoffs/minimal-vga/kicad/rev-a-physical.board.json'
      - 'spinoffs/minimal-vga/kicad/check_rev_a_physical.py'
      - 'spinoffs/minimal-vga/hdl/rev_a_*_lvs.v'
      - 'spinoffs/minimal-vga/sync/rev_a_*_lvs.sh'
      - 'spinoffs/minimal-vga/sync/rev_a_*_map.json'
      - '.github/workflows/hdl.yml'
  pull_request:
    paths:
      - 'hdl/**'
      - 'cosim/**'
      - 'tests/**'
      - 'spinoffs/jukuravi/firmware/**'
      - 'spinoffs/jukuravi/host.py'
      - 'spinoffs/jukuravi/protocol.py'
      - 'spinoffs/jukuravi/nano/**'
      - 'roms/**'
      - 'sync/**'
      - 'media/disks/**'
      - 'media/system/**'
      - 'kicad/juku.board.json'
      - 'scripts/report_video_physical_probes.py'
      - 'docs/video-physical-probes.md'
      - 'scripts/report_video_pit_timing.py'
      - 'docs/video-pit-timing.md'
      - 'spinoffs/minimal-vga/hdl/u24_dram_timing*.v'
      - 'spinoffs/minimal-vga/hdl/vjuga_juku*.v'
      - 'spinoffs/minimal-vga/sim/u24_dram_timing_check.sh'
      - 'spinoffs/minimal-vga/sim/vjuga_boot_check.sh'
      - 'spinoffs/minimal-vga/hdl/revb/**'
      - 'spinoffs/minimal-vga/sim/revb_boot_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_card_tb_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_bus_assert_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_tier_suite.sh'
      - 'spinoffs/minimal-vga/sim/revb_bringup_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_video_check.sh'
      - 'spinoffs/minimal-vga/roms/revb-bringup/**'
      - 'ref/juku-machine-facts.json'
      - 'scripts/check_spinoff_commons.py'
      - 'scripts/check_revb_boards.py'
      - 'spinoffs/minimal-vga/kicad/revb/**'
      - 'spinoffs/minimal-vga/sync/revb_lvs.sh'
      - 'spinoffs/minimal-vga/sync/revb_mem_map.json'
      - 'spinoffs/minimal-vga/roms/ekta37_z80.bin'
      - 'spinoffs/minimal-vga/external/tv80'
      - 'spinoffs/minimal-vga/kicad/rev-a-physical.board.json'
      - 'spinoffs/minimal-vga/kicad/check_rev_a_physical.py'
      - 'spinoffs/minimal-vga/hdl/rev_a_*_lvs.v'
      - 'spinoffs/minimal-vga/sync/rev_a_*_lvs.sh'
      - 'spinoffs/minimal-vga/sync/rev_a_*_map.json'
      - '.github/workflows/hdl.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolves how much of the suite this change can possibly affect. This is an
  # allow list of *confined* scopes and it fails safe: unless every changed file
  # sits inside one known-isolated area, scope is "all" and every job runs. A
  # shared change (hdl/**, cosim/**, sync/**, ...) therefore always runs
  # everything -- which matters, because the minimal-vga sims compile the shared
  # hdl/devices.v, hdl/juku_top.v and hdl/vendor/ sources.
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve changed scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -u
          scope=all
          files=""
          case "$EVENT" in
            pull_request)
              git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
              files=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || true)
              ;;
            push)
              case "$BEFORE" in
                ''|0000000000000000000000000000000000000000) ;;
                *) files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || true) ;;
              esac
              ;;
          esac
          if [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -qvE '^(spinoffs/jukuravi/|tests/jukuravi)'; then
              scope=jukuravi
            elif ! printf '%s\n' "$files" | grep -qvE '^spinoffs/minimal-vga/'; then
              scope=minimal-vga
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "resolved scope: $scope"
          printf '%s\n' "$files" | sed 's/^/  changed: /'

  lvs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yosys for the HDL netlist. KiCad is intentionally NOT installed: the
      # schematic is generated deterministically from the board spec, so check.sh
      # falls back to the KiCad-free board-direct LVS (same connectivity). This
      # avoids fragile KiCad-version/schematic-format mismatches in CI. The real
      # kicad-cli round-trip is exercised locally (KiCad 10).
      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Run LVS check
        run: sh sync/check.sh

      - name: Run rev B mem-card LVS
        # The script intentionally uses Bash (`set -o pipefail`); execute it
        # directly so Actions honors its shebang instead of forcing dash.
        run: spinoffs/minimal-vga/sync/revb_lvs.sh mem

      - name: Run rev B io-card LVS
        run: spinoffs/minimal-vga/sync/revb_lvs.sh io

      - name: Run Rev A power and clock/reset physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_power_clock_reset_lvs.sh

      - name: Run Rev A decode physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_decode_lvs.sh

      - name: Run Rev A Z80 CPU and ROM physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_cpu_rom_lvs.sh

      - name: Run Rev A DRAM-bank physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_dram_bank_lvs.sh

      - name: Run Rev A DRAM address-mux physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_dram_mux_lvs.sh

      - name: Run Rev A refresh-counter physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_refresh_counter_lvs.sh

      - name: Run Rev A empty spare-socket physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_spare_socket_lvs.sh

      - name: Run Rev A DRAM-timing physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_dram_timing_lvs.sh

      - name: Run Rev A PPI physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_ppi_lvs.sh

  # Every behavioral job below installs the same toolchain: Icarus runs the vm80a
  # HDL sims, gcc builds the cosim oracle, g++ builds the portable Jukuravi Nano
  # bridge test.
  fdc:
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Run FDC regression checks
        run: |
          (cd media/disks && sha256sum -c SHA256SUMS)
          (cd media/system && sha256sum -c SHA256SUMS)
          ./sync/juk_disk_check.sh
          ./sync/ekdos_fdc_probe.py
          ./sync/ekdos_jbasic_command_probe.py
          ./sync/ekdos_timing_reference.py
          python3 scripts/report_juku_top_fdc_alignment.py
          git diff --exit-code -- docs/juku-top-fdc-alignment.md
          ./sync/juku_top_fdc_prompt_check.sh
          ./sync/ekdos_checkpoint_reference.py
          ./sync/ekdos_ioseq_reference.py
          ./sync/juku_top_checkpoint_load_check.py
          ./sync/juku_top_checkpoint_resume_probe.py
          ./sync/fdc_check.sh
          ./sync/kp12_check.sh

      # Any generated doc this job's guards rewrote must already be committed.
      # Asserted as a tree diff rather than a hand-maintained file list, so a
      # newly generated doc cannot be forgotten here.
      - name: Check report freshness
        run: git diff --exit-code -- docs sync/ekdos_timing_expected.json

  jukuravi-d0:
    needs: changes
    if: needs.changes.outputs.scope == 'all' || needs.changes.outputs.scope == 'jukuravi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      # Fans its 31 vvp runs out across the runner's cores; see the script header.
      - name: Run Jukuravi D0 diagnostic guards
        run: ./sync/jukuravi_d0_check.sh

      - name: Check report freshness
        run: git diff --exit-code -- docs sync/ekdos_timing_expected.json

  subsystems:
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Run fast subsystem guards
        run: |
          ./sync/basic_cart_check.sh
          ./sync/prom_fallback_check.sh
          ./sync/d2_ready_path_check.sh
          python3 scripts/report_d6_runtime_path.py
          git diff --exit-code -- docs/d6-runtime-path-diagnostic.md
          python3 scripts/validate_rt4_dump.py --self-test
          python3 scripts/validate_re3_dump.py --self-test
          ./sync/beeper_check.sh
          ./sync/serial_check.sh
          ./sync/ie7_check.sh
          ./sync/d96_check.sh
          git diff --exit-code -- docs/d96-read-clock-readiness.md
          ./sync/ie10_check.sh
          ./sync/ag3_check.sh
          ./sync/juku_top_periph_bus_check.sh
          ./sync/jmon33_hdl_probe.sh

      - name: Run Monitor and BASIC reference guards
        run: |
          ./sync/jmon33_interrupt_probe.py
          ./sync/jmon33_ready_probe.py
          ./sync/jmon33_command_probe.py
          ./sync/jmon33_idle_command_probe.py
          ./sync/juku_top_jbasic_prompt_check.sh

      - name: Run video output guards
        run: |
          ./sync/ir16_check.sh
          ./sync/kp14_check.sh
          ./sync/video_timing_check.sh
          ./sync/video_readout_check.sh
          python3 scripts/report_video_physical_probes.py
          git diff --exit-code -- docs/video-physical-probes.md
          python3 scripts/report_video_pit_timing.py
          git diff --exit-code -- docs/video-pit-timing.md

      - name: Check report freshness
        run: git diff --exit-code -- docs sync/ekdos_timing_expected.json

  minimal-vga:
    needs: changes
    if: needs.changes.outputs.scope == 'all' || needs.changes.outputs.scope == 'minimal-vga'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Initialize pinned tv80 core
        run: git submodule update --init spinoffs/minimal-vga/external/tv80

      # B2 runs as its own job below, so this covers the B0/B1 tiers.
      - name: Run VJUGA and rev B tier guards
        env:
          REVB_TIER_SKIP_B2: '1'
        run: |
          ./spinoffs/minimal-vga/sim/u24_dram_timing_check.sh
          ./spinoffs/minimal-vga/sim/vjuga_boot_check.sh
          ./spinoffs/minimal-vga/sim/revb_tier_suite.sh
          python3 spinoffs/minimal-vga/kicad/check_rev_a_physical.py

      - name: Check report freshness
        run: git diff --exit-code -- docs sync/ekdos_timing_expected.json

  # The single slowest gate in the suite (~426s: roughly 1s of wall clock per
  # simulated video write). Its own job so it does not serialize the rest.
  b2-video:
    needs: changes
    if: needs.changes.outputs.scope == 'all' || needs.changes.outputs.scope == 'minimal-vga'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Initialize pinned tv80 core
        run: git submodule update --init spinoffs/minimal-vga/external/tv80

      - name: Run rev B B2 video-card guard
        run: ./spinoffs/minimal-vga/sim/revb_video_check.sh

  # boot_check.sh boots the real ekta37 BIOS through cosim AND all three HDL sim
  # levels, bounded to 6000 video writes (~60s, never the slow full banner), and
  # asserts every level is byte-for-byte identical to cosim -- i.e. the merge
  # (the schematic structure executing the firmware) cannot silently regress.
  boot:
    needs: changes
    if: needs.changes.outputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Run boot regression check
        run: ./sync/boot_check.sh

      - name: Check report freshness
        run: git diff --exit-code -- docs sync/ekdos_timing_expected.json
