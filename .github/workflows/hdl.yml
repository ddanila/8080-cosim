name: CI (HDL — LVS + behavioral boot)

# Path-gated: only runs when the HDL model, the C emulator, the ROM/media inputs,
# the sync guards, or the board connectivity change. Doc-only and routing-loop
# pushes (which never touch these paths) skip it entirely. The deep cosim value
# guard (sync/cosim_check.sh) is intentionally NOT here -- it runs pre-push
# instead (see .githooks/pre-push); this keeps the HDL CI to the boot regression.
#
# The behavioral guards are split across independent jobs that run in parallel.
# A fail-open dependency selector runs only lanes affected by an isolated change;
# shared, unknown, CI-control, scheduled, and tag changes run the complete suite.
# A nightly full sentinel preserves coverage independently of path selection.
#
# Jukuravi paths are listed individually rather than as spinoffs/jukuravi/**:
# that glob also covered sessions/ (captured serial-log bytes) and the prose docs,
# so committing run evidence used to trigger the whole HDL suite for nothing.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Suite scope
        type: choice
        options:
          - full
          - changed
        default: full
  schedule:
    - cron: '23 3 * * *'
  push:
    branches:
      - '**'
    tags:
      - '*'
    paths:
      - 'hdl/**'
      - 'cosim/**'
      - 'tests/**'
      - 'spinoffs/jukuravi/firmware/**'
      - 'spinoffs/jukuravi/network-rom/**'
      - 'spinoffs/jukuravi/host.py'
      - 'spinoffs/jukuravi/protocol.py'
      - 'spinoffs/jukuravi/raster.py'
      - 'spinoffs/jukuravi/raster_retention.py'
      - 'spinoffs/jukuravi/remix/**'
      - 'spinoffs/jukuravi/nano/**'
      - 'spinoffs/jukupoly/**'
      - 'roms/**'
      - 'sync/**'
      - 'media/disks/**'
      - 'media/system/**'
      - 'kicad/juku.board.json'
      - 'scripts/report_video_physical_probes.py'
      - 'docs/video-physical-probes.md'
      - 'scripts/report_video_pit_timing.py'
      - 'docs/video-pit-timing.md'
      - 'spinoffs/minimal-vga/hdl/u24_dram_timing*.v'
      - 'spinoffs/minimal-vga/hdl/vjuga_juku*.v'
      - 'spinoffs/minimal-vga/sim/u24_dram_timing_check.sh'
      - 'spinoffs/minimal-vga/sim/vjuga_boot_check.sh'
      - 'spinoffs/minimal-vga/hdl/revb/**'
      - 'spinoffs/minimal-vga/sim/revb_boot_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_card_tb_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_bus_assert_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_tier_suite.sh'
      - 'spinoffs/minimal-vga/sim/revb_bringup_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_video_check.sh'
      - 'spinoffs/minimal-vga/roms/revb-bringup/**'
      - 'ref/juku-machine-facts.json'
      - 'scripts/check_spinoff_commons.py'
      - 'scripts/check_revb_boards.py'
      - 'spinoffs/minimal-vga/kicad/revb/**'
      - 'spinoffs/minimal-vga/sync/revb_lvs.sh'
      - 'spinoffs/minimal-vga/sync/revb_mem_map.json'
      - 'spinoffs/minimal-vga/roms/ekta37_z80.bin'
      - 'spinoffs/minimal-vga/external/tv80'
      - 'spinoffs/minimal-vga/kicad/rev-a-physical.board.json'
      - 'spinoffs/minimal-vga/kicad/check_rev_a_physical.py'
      - 'spinoffs/minimal-vga/hdl/rev_a_*_lvs.v'
      - 'spinoffs/minimal-vga/sync/rev_a_*_lvs.sh'
      - 'spinoffs/minimal-vga/sync/rev_a_*_map.json'
      - 'ci/__init__.py'
      - 'ci/hdl-ci.json'
      - 'ci/select_hdl_jobs.py'
      - 'ci/check_hdl_ci.py'
      - 'ci/test_select_hdl_jobs.py'
      - '.github/workflows/hdl.yml'
      - '!**/*.md'
      - 'docs/video-physical-probes.md'
      - 'docs/video-pit-timing.md'
  pull_request:
    paths:
      - 'hdl/**'
      - 'cosim/**'
      - 'tests/**'
      - 'spinoffs/jukuravi/firmware/**'
      - 'spinoffs/jukuravi/network-rom/**'
      - 'spinoffs/jukuravi/host.py'
      - 'spinoffs/jukuravi/protocol.py'
      - 'spinoffs/jukuravi/raster.py'
      - 'spinoffs/jukuravi/raster_retention.py'
      - 'spinoffs/jukuravi/remix/**'
      - 'spinoffs/jukuravi/nano/**'
      - 'spinoffs/jukupoly/**'
      - 'roms/**'
      - 'sync/**'
      - 'media/disks/**'
      - 'media/system/**'
      - 'kicad/juku.board.json'
      - 'scripts/report_video_physical_probes.py'
      - 'docs/video-physical-probes.md'
      - 'scripts/report_video_pit_timing.py'
      - 'docs/video-pit-timing.md'
      - 'spinoffs/minimal-vga/hdl/u24_dram_timing*.v'
      - 'spinoffs/minimal-vga/hdl/vjuga_juku*.v'
      - 'spinoffs/minimal-vga/sim/u24_dram_timing_check.sh'
      - 'spinoffs/minimal-vga/sim/vjuga_boot_check.sh'
      - 'spinoffs/minimal-vga/hdl/revb/**'
      - 'spinoffs/minimal-vga/sim/revb_boot_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_card_tb_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_bus_assert_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_tier_suite.sh'
      - 'spinoffs/minimal-vga/sim/revb_bringup_check.sh'
      - 'spinoffs/minimal-vga/sim/revb_video_check.sh'
      - 'spinoffs/minimal-vga/roms/revb-bringup/**'
      - 'ref/juku-machine-facts.json'
      - 'scripts/check_spinoff_commons.py'
      - 'scripts/check_revb_boards.py'
      - 'spinoffs/minimal-vga/kicad/revb/**'
      - 'spinoffs/minimal-vga/sync/revb_lvs.sh'
      - 'spinoffs/minimal-vga/sync/revb_mem_map.json'
      - 'spinoffs/minimal-vga/roms/ekta37_z80.bin'
      - 'spinoffs/minimal-vga/external/tv80'
      - 'spinoffs/minimal-vga/kicad/rev-a-physical.board.json'
      - 'spinoffs/minimal-vga/kicad/check_rev_a_physical.py'
      - 'spinoffs/minimal-vga/hdl/rev_a_*_lvs.v'
      - 'spinoffs/minimal-vga/sync/rev_a_*_lvs.sh'
      - 'spinoffs/minimal-vga/sync/rev_a_*_map.json'
      - 'ci/__init__.py'
      - 'ci/hdl-ci.json'
      - 'ci/select_hdl_jobs.py'
      - 'ci/check_hdl_ci.py'
      - 'ci/test_select_hdl_jobs.py'
      - '.github/workflows/hdl.yml'
      - '!**/*.md'
      - 'docs/video-physical-probes.md'
      - 'docs/video-pit-timing.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Resolves the affected lanes from the checked-in dependency table. Unknown
  # paths and an unavailable diff fail open to every lane. The manifest validator
  # also proves that each expensive workflow entrypoint has an owning lane and
  # that changing the entrypoint selects that lane.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.selector.outputs.run_full }}
      run_lvs: ${{ steps.selector.outputs.run_lvs }}
      run_fdc: ${{ steps.selector.outputs.run_fdc }}
      run_jukuravi_d0: ${{ steps.selector.outputs.run_jukuravi_d0 }}
      run_network_rom: ${{ steps.selector.outputs.run_network_rom }}
      run_jukuravi_regression: ${{ steps.selector.outputs.run_jukuravi_regression }}
      run_jukupoly: ${{ steps.selector.outputs.run_jukupoly }}
      run_subsystems: ${{ steps.selector.outputs.run_subsystems }}
      run_minimal_vga: ${{ steps.selector.outputs.run_minimal_vga }}
      run_revb_ttl_boot: ${{ steps.selector.outputs.run_revb_ttl_boot }}
      run_boot: ${{ steps.selector.outputs.run_boot }}
      selection_json: ${{ steps.selector.outputs.selection_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate CI coverage manifest
        run: |
          python3 ci/check_hdl_ci.py
          python3 -m unittest -v ci.test_select_hdl_jobs

      - name: Resolve affected lanes
        id: selector
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          FORCE_FULL: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files_file=$(mktemp)
          trap 'rm -f "$files_file"' EXIT
          case "$EVENT" in
            pull_request)
              git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
              git diff --name-only "origin/$BASE_REF...HEAD" >"$files_file" 2>/dev/null || true
              ;;
            push)
              case "$BEFORE" in
                ''|0000000000000000000000000000000000000000) ;;
                *) git diff --name-only "$BEFORE" "$GITHUB_SHA" >"$files_file" 2>/dev/null || true ;;
              esac
              ;;
            workflow_dispatch)
              git diff --name-only "HEAD^" HEAD >"$files_file" 2>/dev/null || true
              ;;
          esac

          selector_args=(
            --paths-file "$files_file"
            --github-output "$GITHUB_OUTPUT"
            --step-summary "$GITHUB_STEP_SUMMARY"
          )
          skip_full=false
          if [ "$EVENT" = "schedule" ]; then
            previous_full_sha=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/hdl.yml/runs?event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)
            if [ -n "$previous_full_sha" ] && [ "$previous_full_sha" = "$GITHUB_SHA" ]; then
              skip_full=true
            fi
          fi
          if [ "$skip_full" = "true" ]; then
            selector_args+=(--skip-all)
          elif [ "$FORCE_FULL" = "true" ]; then
            selector_args+=(--force-full)
          fi
          python3 ci/select_hdl_jobs.py "${selector_args[@]}"

  lvs:
    needs: changes
    if: needs.changes.outputs.run_lvs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yosys for the HDL netlist. KiCad is intentionally NOT installed: the
      # schematic is generated deterministically from the board spec, so check.sh
      # falls back to the KiCad-free board-direct LVS (same connectivity). This
      # avoids fragile KiCad-version/schematic-format mismatches in CI. The real
      # kicad-cli round-trip is exercised locally (KiCad 10).
      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Run LVS check
        run: sh sync/check.sh

      - name: Run rev B mem-card LVS
        # The script intentionally uses Bash (`set -o pipefail`); execute it
        # directly so Actions honors its shebang instead of forcing dash.
        run: spinoffs/minimal-vga/sync/revb_lvs.sh mem

      - name: Run rev B io-card LVS
        run: spinoffs/minimal-vga/sync/revb_lvs.sh io

      - name: Run Rev A power and clock/reset physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_power_clock_reset_lvs.sh

      - name: Run Rev A decode physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_decode_lvs.sh

      - name: Run Rev A Z80 CPU and ROM physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_cpu_rom_lvs.sh

      - name: Run Rev A DRAM-bank physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_dram_bank_lvs.sh

      - name: Run Rev A DRAM address-mux physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_dram_mux_lvs.sh

      - name: Run Rev A refresh-counter physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_refresh_counter_lvs.sh

      - name: Run Rev A empty spare-socket physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_spare_socket_lvs.sh

      - name: Run Rev A DRAM-timing physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_dram_timing_lvs.sh

      - name: Run Rev A PPI physical LVS
        run: spinoffs/minimal-vga/sync/rev_a_ppi_lvs.sh

  # Every behavioral job below installs the same toolchain: Icarus runs the vm80a
  # HDL sims, gcc builds the cosim oracle, g++ builds the portable Jukuravi Nano
  # bridge test.
  fdc:
    needs: changes
    if: needs.changes.outputs.run_fdc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Run FDC regression checks
        run: |
          (cd media/disks && sha256sum -c SHA256SUMS)
          (cd media/system && sha256sum -c SHA256SUMS)
          ./sync/juk_disk_check.sh
          ./sync/ekdos_fdc_probe.py
          ./sync/ekdos_jbasic_command_probe.py
          ./sync/ekdos_timing_reference.py
          python3 scripts/report_juku_top_fdc_alignment.py
          git diff --exit-code -- docs/juku-top-fdc-alignment.md
          ./sync/juku_top_fdc_prompt_check.sh
          ./sync/ekdos_checkpoint_reference.py
          ./sync/ekdos_ioseq_reference.py
          ./sync/juku_top_checkpoint_load_check.py
          ./sync/juku_top_checkpoint_resume_probe.py
          ./sync/fdc_check.sh
          ./sync/kp12_check.sh

      # Every generated doc this job's writers rewrote must already be committed.
      # Named explicitly, not as a tree diff: scripts/check_generated_report_coverage.py
      # asserts each artifact appears in a `git diff --exit-code --` here, so generic
      # CI catches list drift before this expensive job ever runs.
      - name: Check report freshness
        run: |
          git diff --exit-code -- \
            docs/ekdos-fdc-probe.md \
            docs/ekdos-jbasic-command-probe.md \
            docs/ekdos-timing-reference.md \
            sync/ekdos_timing_expected.json \
            docs/ekdos-checkpoint-reference.md \
            docs/ekdos-ioseq-reference.md \
            docs/juku-top-checkpoint-load.md \
            docs/juku-top-checkpoint-resume.md \
            docs/fdc-readiness.md

  jukuravi-d0:
    needs: changes
    if: needs.changes.outputs.run_jukuravi_d0 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      # The D0 aggregate also rebuilds the shared mnemonic smoke fixture.
      # Fetch the same assembler and platform sources as the later Jukuravi
      # regression job before starting its parallel fan-out.
      - name: Fetch assembler and shared sources
        run: git submodule update --init third_party/zmac third_party/juku-common

      # Fans its 31 vvp runs out across the runner's cores; see the script header.
      - name: Run Jukuravi D0 diagnostic guards
        run: ./sync/jukuravi_d0_check.sh

  network-rom:
    needs: changes
    if: needs.changes.outputs.run_network_rom == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ROM/HDL toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc iverilog

      - name: Fetch assembler and shared sources
        run: git submodule update --init third_party/zmac third_party/juku-common

      - name: Run network-ROM ABI and fault matrix
        run: ./sync/network_first_rom_abi_check.sh

      - name: Run network-ROM structural HDL matrix
        run: ./sync/network_first_rom_hdl_check.sh

  # The T28-T32 loader/recovery guards. These are documented in the Jukuravi
  # READMEs and were reachable only by hand -- no workflow and no git hook ran
  # them. They rest on the cosim oracle, the pty-driven host CLI, and nasm
  # reassembly of the committed .asm/.bin pairs, and they run in parallel well
  # inside the suite's critical path, so wiring them up costs no wall clock.
  jukuravi-regression:
    needs: changes
    if: needs.changes.outputs.run_jukuravi_regression == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # nasm reassembles the committed loader snippets to prove the .bin files
      # still match their sources. iverilog is required because the T32 guard
      # ends in sync/jukuravi_vm80a_a12_check.sh, which simulates the vm80a core
      # against that same increment probe.
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y bison gcc g++ iverilog nasm

      # The T31 smoke fixture is assembled from shared mnemonic sources: zmac
      # builds it and juku-common supplies the included music. Without both
      # submodules build_smoke.py --check aborts and the job fails.
      - name: Fetch assembler and shared sources
        run: git submodule update --init third_party/zmac third_party/juku-common

      - name: Run T28 loader guards
        run: ./sync/jukuravi_t28_check.sh

      - name: Run T29 recovery guards
        run: ./sync/jukuravi_t29_check.sh

      - name: Run T30 TxEMPTY guards
        run: ./sync/jukuravi_t30_check.sh

      - name: Run T31 low-4K and A12 guards
        run: ./sync/jukuravi_t31_check.sh

      - name: Run T32 upper-ROM wait-class guards
        run: ./sync/jukuravi_t32_check.sh

      # T33-T36 checks remain hand-run (they were never wired). The remix
      # guard is wired from the start: it rebuilds ekta4401.bin from pinned
      # ekta37, checks the bounded patch set and all eight ROM chunk
      # checksums, and boots it in cosim to prove the relocated command
      # table and the H command execute.
      - name: Run ekta4401 remix guards
        run: ./sync/ekta4401_check.sh

  jukupoly:
    needs: changes
    if: needs.changes.outputs.run_jukupoly == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch assembler and shared sources
        run: git submodule update --init third_party/zmac third_party/juku-common

      - name: Run JukuPoly engine, budget, song, and WAV guards
        run: |
          ./sync/jukupoly_three_voice_check.sh
          ./sync/jukupoly_check.sh
          ./sync/jukupoly_library_check.sh
          ./sync/jukupoly_baseline_check.sh
          ./sync/jukupoly_wav_check.sh

  subsystems:
    needs: changes
    if: needs.changes.outputs.run_subsystems == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Run fast subsystem guards
        run: |
          ./sync/i8080_check.sh
          ./sync/i8080_vm80a_diff_check.sh
          ./sync/inta_bus_check.sh
          ./sync/basic_cart_check.sh
          ./sync/prom_fallback_check.sh
          ./sync/d2_ready_path_check.sh
          python3 scripts/report_d6_runtime_path.py
          git diff --exit-code -- docs/d6-runtime-path-diagnostic.md
          python3 scripts/validate_rt4_dump.py --self-test
          python3 scripts/validate_re3_dump.py --self-test
          ./sync/beeper_check.sh
          ./sync/serial_check.sh
          ./sync/ie7_check.sh
          ./sync/d96_check.sh
          git diff --exit-code -- docs/d96-read-clock-readiness.md
          ./sync/ie10_check.sh
          ./sync/ag3_check.sh
          ./sync/juku_top_periph_bus_check.sh
          ./sync/jmon33_hdl_probe.sh

      - name: Run Monitor and BASIC reference guards
        run: |
          ./sync/jmon33_interrupt_probe.py
          ./sync/jmon33_ready_probe.py
          ./sync/jmon33_command_probe.py
          ./sync/jmon33_idle_command_probe.py
          ./sync/juku_top_jbasic_prompt_check.sh

      - name: Run video output guards
        run: |
          ./sync/ir16_check.sh
          ./sync/kp14_check.sh
          ./sync/video_timing_check.sh
          ./sync/video_readout_check.sh
          python3 scripts/report_video_physical_probes.py
          git diff --exit-code -- docs/video-physical-probes.md
          python3 scripts/report_video_pit_timing.py
          git diff --exit-code -- docs/video-pit-timing.md

      # See the note in the fdc job: named explicitly so generic CI can verify
      # the writer/artifact contract without running this job.
      - name: Check report freshness
        run: |
          git diff --exit-code -- \
            docs/basic-cart-readiness.md \
            docs/d2-ready-path-check.md \
            docs/beeper-readiness.md \
            docs/serial-handoff.md \
            docs/ie7-counter-readiness.md \
            docs/ie10-counter-readiness.md \
            docs/ag3-oneshot-readiness.md \
            docs/juku-top-periph-bus-check.md \
            docs/juku-top-jbasic-verilator-probe.md \
            docs/jmon33-hdl-probe.md \
            docs/jmon33-interrupt-probe.md \
            docs/jmon33-ready-probe.md \
            docs/jmon33-command-probe.md \
            docs/jmon33-idle-command-probe.md \
            docs/ir16-readiness.md \
            docs/kp14-readiness.md \
            docs/video-timing-reference.md \
            docs/video-readout-readiness.md \
            docs/video-physical-probes.md \
            docs/video-pit-timing.md

  minimal-vga:
    needs: changes
    if: needs.changes.outputs.run_minimal_vga == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Initialize pinned tv80 core
        run: git submodule update --init spinoffs/minimal-vga/external/tv80

      # The TTL video-card boot runs as its own job below; the tier suite's
      # revb_boot_check.sh call therefore covers the decode-mode boots only.
      - name: Run VJUGA and rev B tier guards
        env:
          REVB_BOOT_PHASE: modes
        run: |
          ./spinoffs/minimal-vga/sim/u24_dram_timing_check.sh
          ./spinoffs/minimal-vga/sim/vjuga_boot_check.sh
          ./spinoffs/minimal-vga/sim/revb_tier_suite.sh
          python3 spinoffs/minimal-vga/kicad/check_rev_a_physical.py

  # The single slowest gate in the suite (~426s). Two async clocks -- the CPU plus
  # the 25 MHz dot clock -- make this boot far heavier than the single-clock
  # decode-mode boots, so it gets its own job instead of serializing them.
  revb-ttl-boot:
    needs: changes
    if: needs.changes.outputs.run_revb_ttl_boot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      - name: Initialize pinned tv80 core
        run: git submodule update --init spinoffs/minimal-vga/external/tv80

      - name: Run rev B B2 TTL video-card boot
        env:
          REVB_BOOT_PHASE: ttl
        run: ./spinoffs/minimal-vga/sim/revb_boot_check.sh

  # boot_check.sh boots the real ekta37 BIOS through cosim AND all three HDL sim
  # levels, bounded to 6000 video writes (~60s, never the slow full banner), and
  # asserts every level is byte-for-byte identical to cosim -- i.e. the merge
  # (the schematic structure executing the firmware) cannot silently regress.
  boot:
    needs: changes
    if: needs.changes.outputs.run_boot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y gcc g++ iverilog

      # No generated-doc writers here, so no freshness assertion -- matching the
      # pre-split workflow, where the freshness step ran before boot_check.sh.
      - name: Run boot regression check
        run: ./sync/boot_check.sh

  results:
    if: always()
    needs:
      - changes
      - lvs
      - fdc
      - jukuravi-d0
      - network-rom
      - jukuravi-regression
      - jukupoly
      - subsystems
      - minimal-vga
      - revb-ttl-boot
      - boot
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected-lane results
        env:
          SELECTION_JSON: ${{ needs.changes.outputs.selection_json }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          errors = []
          try:
              selection = json.loads(os.environ["SELECTION_JSON"])
          except (KeyError, json.JSONDecodeError) as exc:
              selection = {"jobs": {}}
              errors.append(f"selection output is unavailable: {exc}")
          needs = json.loads(os.environ["NEEDS_JSON"])

          rows = []
          expected_jobs = {
              "lvs",
              "fdc",
              "jukuravi-d0",
              "network-rom",
              "jukuravi-regression",
              "jukupoly",
              "subsystems",
              "minimal-vga",
              "revb-ttl-boot",
              "boot",
          }
          selected_jobs = selection.get("jobs", {})
          if set(selected_jobs) != expected_jobs:
              errors.append(
                  "selection lane set differs from the results contract: "
                  f"expected {sorted(expected_jobs)}, got {sorted(selected_jobs)}"
              )
          if needs.get("changes", {}).get("result") != "success":
              errors.append(
                  f"selector job ended as {needs.get('changes', {}).get('result', 'missing')}"
              )
          for job in sorted(expected_jobs):
              selected = selected_jobs.get(job, False)
              result = needs.get(job, {}).get("result", "missing")
              rows.append((job, selected, result))
              if selected and result != "success":
                  errors.append(f"selected lane {job} ended as {result}")
              if not selected and result != "skipped":
                  errors.append(f"unselected lane {job} unexpectedly ended as {result}")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## HDL CI results\n\n")
              handle.write("| Lane | Selected | Result |\n|---|---|---|\n")
              for job, selected, result in rows:
                  handle.write(
                      f"| `{job}` | {'yes' if selected else 'no'} | `{result}` |\n"
                  )
              if errors:
                  handle.write("\n### Contract violations\n\n")
                  for error in errors:
                      handle.write(f"- {error}\n")

          if errors:
              raise SystemExit("; ".join(errors))
          PY
