name: Publish smoke kit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - third_party/dac-emulation
      - .gitmodules
      - cosim/**
      - host/**
      - tests/fixtures/**
      - spinoffs/jukuravi/remix/ekta4401.bin
      - spinoffs/jukuravi/remix/ekta4402.bin
      - spinoffs/jukuravi/network-rom/juku-network-rom-abi1.bin
      - .github/smoke-kit/**
      - .github/workflows/smoke-kit.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: smoke-kit
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize pinned emulator
        timeout-minutes: 5
        run: git submodule update --init third_party/dac-emulation

      - name: Prepare minimal build context
        timeout-minutes: 5
        run: bash .github/smoke-kit/prepare.sh "$RUNNER_TEMP/smoke-kit"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/smoke-kit
          file: ${{ runner.temp }}/smoke-kit/Dockerfile
          push: true
          tags: |
            ghcr.io/ddanila/8080-cosim-smoke-kit:v2
            ghcr.io/ddanila/8080-cosim-smoke-kit:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ddanila/8080-cosim
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Minimal Juku simulator kit for downstream boot smoke tests
          cache-from: type=gha,scope=smoke-kit
          cache-to: type=gha,mode=max,scope=smoke-kit
